plugins { id 'com.android.application' }

def privateEnv = [:]
def envFile = rootProject.file('../.env.production.local')
if (envFile.exists()) {
    envFile.eachLine { line ->
        if (line =~ /^[A-Z_]+=/) {
            def parts = line.split('=', 2)
            privateEnv[parts[0]] = parts[1].trim().replaceAll(/^['"]|['"]$/, '')
        }
    }
}
def quoted = { value -> groovy.json.JsonOutput.toJson(value ?: '') }
def signing = new Properties()
def signingFile = rootProject.file('signing.local.properties')
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }

android {
    namespace 'art.aduning.billddesk'
    compileSdk 35
    defaultConfig {
        applicationId 'art.aduning.billddesk'
        minSdk 26
        targetSdk 35
        versionCode 28
        versionName '0.1.27'
        ndk { abiFilters 'arm64-v8a' }
        buildConfigField 'String', 'SERVER_URL', quoted(privateEnv['VITE_WEB_DESK_URL'] ?: 'https://desk.aduning.art')
        buildConfigField 'String', 'TURN_URL', quoted(privateEnv['VITE_COTURN_URL'] ?: 'turn:desk.aduning.art:3478')
        buildConfigField 'String', 'TURN_USER', quoted(privateEnv['VITE_COTURN_USERNAME'])
        buildConfigField 'String', 'TURN_PASSWORD', quoted(privateEnv['VITE_COTURN_CREDENTIAL'])
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        if (signingFile.exists()) {
            privateRelease {
                storeFile file(signing['storeFile'])
                storePassword signing['storePassword']
                keyAlias signing['keyAlias']
                keyPassword signing['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (signingFile.exists()) signingConfig signingConfigs.privateRelease
        }
    }
}
dependencies {
    implementation 'io.github.webrtc-sdk:android:150.7871.01'
    implementation('io.socket:socket.io-client:2.1.2') {
        exclude group: 'org.json', module: 'json'
    }
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
