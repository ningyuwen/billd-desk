name: billd-desk
services:
  mysql:
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: billd_desk
      MYSQL_USER: billddesk
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - '127.0.0.1:13306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1']
      interval: 10s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.0@sha256:352c1fdadc91926edda08f45aeb3f27f37194c2f14101229c0523a11195c96e3
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--requirepass',
        '${REDIS_PASSWORD}',
      ]
    ports:
      - '127.0.0.1:16379:6379'
    volumes:
      - redis-data:/data
  coturn:
    image: coturn/coturn@sha256:bbefd3e1fdfdc0d58770fe01b581fd8b00d9f3a5580d00acb77cf719a6bc78e3
    restart: unless-stopped
    network_mode: host
    command: ['-c', '/etc/coturn/turnserver.conf']
    volumes:
      - /etc/billd-desk/turnserver.conf:/etc/coturn/turnserver.conf:ro
volumes:
  mysql-data:
  redis-data:
