# Include only inside the existing desk.aduning.art HTTPS server block.
# Ciphertext-only ZIP and password hashes are outside all public document roots.
location = /private/billd-desk-migration.zip {
    auth_basic "BilldDesk configuration migration";
    auth_basic_user_file /etc/nginx/billd-desk-migration.htpasswd;
    alias /srv/billd-desk-migration/billd-desk-migration.zip;
    default_type application/zip;
    add_header Content-Disposition 'attachment; filename="billd-desk-migration.zip"';
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_req zone=billd_migration burst=5 nodelay;
    limit_req_status 429;
    limit_except GET { deny all; }
    access_log /var/log/nginx/access.log combined;
}
location ^~ /private/ {
    return 404;
}
